# .debug-swallow-allowlist.yaml -- baseline for
# tests/test_no_debug_only_swallows.py (alpha-engine-config-I10226).
#
# The class this guards: an `except Exception` (or a narrower except clause
# immediately following one, per-site) whose body only records the failure
# at logger.debug(...) or discards it as a bare `pass` -- invisible on any
# entrypoint whose root logger runs at INFO (~/Development/CLAUDE.md "Fail
# loud and fast"). Lifted detector: nousergon_lib.testing.debug_swallow_guard
# (alpha-engine-config-I10226, mirroring crucible-executor's original
# .debug-swallow-allowlist.yaml, alpha-engine-config-I10031,
# crucible-executor-PR547). A new site with no entry fails the build. An
# entry whose `expires` has passed fails loudly -- re-justify or remove,
# never silently re-grandfather. An entry that no longer matches anything
# ALSO fails, so the allowance cannot quietly widen after the site it
# covered is gone or fixed.
#
# `path` + `line` identify the `except` line itself (the line the guard's
# AST walk reports). Every entry requires a `reason` naming (a) the failure
# mode swallowed and (c) the concrete recording surface (or the explicit
# "no recording surface -- carve-out" for a transport/teardown/
# expected-absence-with-fallback swallow the fleet rule's own carve-out
# clause covers), per ~/Development/CLAUDE.md "Fail loud and fast."
#
# Sweep for alpha-engine-config-I10226: the AST detector found 15 live
# sites (not the issue's crude 29). Of those 15, 2 were fixed to
# logger.warning with a named recording surface (analysis/veto_value.py and
# reporter.py) and no longer appear in the live scan -- see the PR body for
# both. The remaining 13, listed below, are all genuine
# transport/teardown/expected-absence-with-fallback carve-outs: none write
# or gate a durable backtest artifact, result, or manifest, and every
# multi-source fallback chain here (evaluate.py scoring weights,
# pipeline_common.py sector_map.json) already terminates in either a
# validated raise-on-drift chokepoint or a WARNING on full exhaustion.

