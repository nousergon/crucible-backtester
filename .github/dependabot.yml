# Standard fleet Dependabot config (weekly, grouped minor+patch) — alpha-engine-config-I2525
# Majors are surfaced as ONE grouped PR per ecosystem, throttled by a 30-day
# major-version cooldown — alpha-engine-config-I2734. NOTE: Dependabot requires a
# unique (package-ecosystem, directory, target-branch) per update config, so the
# I2734 intent CANNOT be a second per-ecosystem block on its own monthly schedule
# (that shape is invalid and disables ALL updates for the repo). The `majors`
# group + `cooldown.semver-major-days: 30` below is the closest legal expression.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # PAUSED — Crucible v2 phase-4 decommission (alpha-engine-config-I10251,
    # Brian ruling 2026-09-08). This repo is a v1 component scheduled for
    # retirement by alpha-engine-config-I9760, so a weekly pip version bump here
    # costs a CI cycle and a backlog-triage entry on code that is being deleted.
    # A limit of 0 suppresses VERSION updates only: Dependabot SECURITY updates
    # carry their own separate limit and still open PRs (measured 2026-09-08),
    # which is why the block is kept rather than deleted. The github-actions
    # block below is deliberately UNTOUCHED — supply-chain SHA re-pins keep
    # flowing, and repo_baseline_sweep.py RB-4.3 asserts that block's presence.
    # Restore the pre-pause value at cutover — see I10251's closes-when.
    open-pull-requests-limit: 0
    cooldown:
      semver-major-days: 30
    # Deferred to the tracked migration alpha-engine-config-I5213. Dependabot re-proposing
    # this every week is pure queue noise while the migration is unscheduled, and
    # it re-enters /backlog-triage each cycle. Narrow by dependency-name ON
    # PURPOSE: a blanket "*" major ignore would also suppress future
    # security-relevant majors. REMOVING THIS ENTRY IS PART OF alpha-engine-config-I5213's closes-when.
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # plotly majors break `import vectorbt` (alpha-engine-config-I8759): vectorbt 0.28.5
      # builds its templates at import time and plotly 7 changed the validator
      # they go through, so four test files fail at COLLECTION. Dependabot
      # proposed it, CI refused it, and the cycle repeated as queue noise.
      # Narrow by dependency-name for the same reason `pandas` is: a blanket
      # "*" major ignore would also suppress security-relevant majors.
      # REMOVING THIS ENTRY IS PART OF alpha-engine-config-I8759's closes-when — it goes when
      # vectorbt supports the plotly major, not when the noise is annoying.
      - dependency-name: "plotly"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major

  # NOTE: no cooldown here — Dependabot rejects cooldown.semver-major-days for
  # the github-actions ecosystem (semver cooldown keys are per-ecosystem; pip
  # supports them, actions does not — validated live 2026-07-16). The majors
  # group alone carries the I2734 grouping intent for actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
